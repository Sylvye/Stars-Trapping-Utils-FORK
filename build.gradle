plugins {
    id "fabric-loom" version "1.13.3"
    id "maven-publish"
}

version = "1.0.0"
group = "dev.mrnofade"

base {
    archivesName = "starstrappingutils"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.4:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    implementation include("com.github.jagrosh:DiscordIPC:master-SNAPSHOT")
    implementation include("org.json:json:20240303")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

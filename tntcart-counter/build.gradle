plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
    id "maven-publish"
}

version = "1.0.0+26.2"
group = "dev.mrnofade"

base {
    archivesName = "starstrappingutils"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
    implementation include("com.github.jagrosh:DiscordIPC:master-SNAPSHOT")
    implementation include("org.json:json:20240303")
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
